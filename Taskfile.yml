version: "3"
dotenv: [".env"]

vars:
  # Single source of truth: the git tag. See docs/decisions/0001-version-from-git-tag.md
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ

tasks:
  dev:
    desc: Run Go backend (Air) and SvelteKit dev server in parallel
    deps: [dev:backend, dev:frontend]

  dev:backend:
    desc: Run Go backend with hot reload
    # PocketBase's `serve` defaults to 127.0.0.1:8090 when --http isn't
    # passed, which silently ignores PUBLIC_PB_PORT from .env. Pass the
    # flag explicitly so a non-8090 .env actually wins; mirrors the
    # dev:backend:lan recipe below.
    cmds: ["air -c .air.toml -- --http=127.0.0.1:${PUBLIC_PB_PORT}"]

  dev:frontend:
    desc: Run SvelteKit dev server (typegen waits for backend, then generates types)
    dir: sveltekit
    cmds:
      - cmd: "pnpm --silent typegen &"
      - cmd: "pnpm dev"

  dev:lan:
    desc: Run dev servers bound to all interfaces — reachable from other devices on the LAN
    deps: [dev:backend:lan, dev:frontend:lan]

  dev:backend:lan:
    desc: Run Go backend with hot reload, bound to 0.0.0.0
    cmds: ["air -c .air.toml -- --http=0.0.0.0:${PUBLIC_PB_PORT}"]

  dev:frontend:lan:
    desc: Run SvelteKit dev server bound to 0.0.0.0
    dir: sveltekit
    cmds:
      - cmd: "pnpm --silent typegen &"
      - cmd: "pnpm dev --host 0.0.0.0"

  typegen:
    desc: Generate TypeScript types from running PocketBase instance (requires task dev:backend)
    dir: sveltekit
    cmds: ["pnpm typegen"]

  # --- migrations (schema source of truth — see docs/MIGRATIONS.md) -----------
  migrate:
    desc: Apply pending migrations (alias of migrate:up)
    cmds: [{ task: "migrate:up" }]

  migrate:up:
    desc: Apply pending migrations. Beta/prod also do this automatically on boot.
    cmds: ["go run ./cmd/server migrate up"]

  migrate:create:
    desc: 'Create a blank migration: task migrate:create -- backfill_gamertags'
    cmds: ["go run ./cmd/server migrate create {{.CLI_ARGS}}"]

  migrate:collections:
    desc: Snapshot current collections into a migration (baseline / re-sync)
    cmds: ["go run ./cmd/server migrate collections"]

  migrate:down:
    desc: Revert the last applied migration (DEV ONLY — destructive)
    cmds: ["go run ./cmd/server migrate down"]

  migrate:squash:
    desc: 'Squash this branch''s granular migrations into one release migration: task migrate:squash -- --version v0.3.0'
    cmds: ["./scripts/migrate-squash.sh {{.CLI_ARGS}}"]

  migrate:verify:
    desc: 'Prove the squash == the granular set (run before merging): task migrate:verify -- --from /path/to/pb_data-copy'
    cmds: ["./scripts/migrate-verify.sh {{.CLI_ARGS}}"]

  build:
    desc: Build production binary with static frontend
    cmds:
      - task: build:frontend
      - task: build:backend

  build:frontend:
    desc: Build SvelteKit static output
    dir: sveltekit
    env:
      PUBLIC_APP_VERSION: "{{.VERSION}}"
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm build
    sources: ["src/**/*", "package.json", "svelte.config.js", "vite.config.ts"]
    generates: ["../pb_public/**/*"]

  build:backend:
    desc: Build Go binary (version baked in via ldflags)
    cmds:
      - CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/Stewball32/xemu-cartographer/internal/version.Version={{.VERSION}} -X github.com/Stewball32/xemu-cartographer/internal/version.Commit={{.COMMIT}} -X github.com/Stewball32/xemu-cartographer/internal/version.Date={{.DATE}}" -o ./bin/server ./cmd/server
    sources: ["cmd/**/*.go", "internal/**/*.go", "go.mod", "go.sum"]
    generates: ["bin/server"]

  test:
    desc: Run Go tests and frontend type-check
    cmds:
      # Scope matches `task lint` — keeps `./...` from walking into the
      # root-owned containers/ bind-mount tree when local containers have
      # run as root (see docs/prod_deployment / Container caveats).
      - go test ./cmd/... ./internal/...
      - cd sveltekit && pnpm check

  fmt:
    desc: Format Go and frontend code
    cmds:
      - go fmt ./cmd/... ./internal/...
      - cd sveltekit && pnpm format

  lint:
    desc: Lint Go and frontend code
    cmds:
      - golangci-lint run --build-tags=dev ./cmd/... ./internal/...
      - cd sveltekit && pnpm lint

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/ tmp/ pb_public/

  container:build:
    desc: Build container image with Podman (tags VERSION and latest)
    cmds:
      - podman build --build-arg VERSION={{.VERSION}} --build-arg COMMIT={{.COMMIT}} --build-arg DATE={{.DATE}} -t xemu-cartographer:{{.VERSION}} -t xemu-cartographer:latest -f Containerfile .

  container:run:
    desc: Run container with Podman
    cmds:
      [
        "podman run -p ${PUBLIC_PB_PORT:-8090}:8090 -v pb_data:/app/pb_data:z xemu-cartographer:latest",
      ]
