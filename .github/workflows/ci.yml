name: CI

on:
  # `beta` is gated as well as `main`: it is the long-lived integration branch
  # the /srv pre tier deploys from (srv-pre.sh xemu-cartographer beta), so a
  # direct push there reaches a running tier and must not skip CI.
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

env:
  PUBLIC_PB_PORT: 8090

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sveltekit
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sveltekit/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: pb_public
          path: pb_public/
          retention-days: 1

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        # Scoped to ./cmd/... ./internal/... (mirrors Taskfile `test`) to skip
        # the root-owned containers/ mount. Makes the 58 existing test files
        # load-bearing on every push/PR.
        run: go test ./cmd/... ./internal/...

      - name: Build
        run: CGO_ENABLED=0 go build -o bin/server ./cmd/server

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: sveltekit
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sveltekit/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: pb_public
          path: pb_public/

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm test:e2e

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: sveltekit/playwright-report/
          retention-days: 7
