<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" role="img" aria-label="xemu-cartographer XC tight chrome">
  <defs>
    <linearGradient id="t3Chrome" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F5F8FB"/>
      <stop offset="35%" stop-color="#B0BAC4"/>
      <stop offset="65%" stop-color="#5A646E"/>
      <stop offset="100%" stop-color="#2A3038"/>
    </linearGradient>
    <linearGradient id="t3Energy" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#D8F480"/>
      <stop offset="50%" stop-color="#9BCA3C"/>
      <stop offset="100%" stop-color="#5A8020"/>
    </linearGradient>
    <linearGradient id="t3RingChrome" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#9BCA3C"/>
      <stop offset="50%" stop-color="#F5F8FB"/>
      <stop offset="100%" stop-color="#5A646E"/>
    </linearGradient>
  </defs>

  <!-- Back half of halo ring -->
  <g transform="translate(120,90) rotate(-12)">
    <path d="M -90,0 A 90,22 0 0,0 90,0" fill="none" stroke="#1A1F26" stroke-width="6.5" opacity="0.6"/>
    <path d="M -88,0 A 88,20 0 0,0 88,0" fill="none" stroke="url(#t3RingChrome)" stroke-width="2.5" opacity="0.7"/>
  </g>

  <!-- X (chrome shell, green energy core) -->
  <g transform="translate(85,90)">
    <g transform="rotate(45)">
      <rect x="-38" y="-11" width="76" height="22" rx="2" fill="url(#t3Chrome)" stroke="#1A1F26" stroke-width="2"/>
      <rect x="-32" y="-3" width="64" height="6" rx="1" fill="url(#t3Energy)"/>
      <rect x="-36" y="-10" width="72" height="2" rx="1" fill="#FFFFFF" opacity="0.85"/>
    </g>
    <g transform="rotate(-45)">
      <rect x="-38" y="-11" width="76" height="22" rx="2" fill="url(#t3Chrome)" stroke="#1A1F26" stroke-width="2"/>
      <rect x="-32" y="-3" width="64" height="6" rx="1" fill="url(#t3Energy)"/>
      <rect x="-36" y="-10" width="72" height="2" rx="1" fill="#FFFFFF" opacity="0.85"/>
    </g>
  </g>

  <!-- C -->
  <g transform="translate(163,90)">
    <path d="M 25.46,-25.46 A 36,36 0 1,0 25.46,25.46 L 12.73,12.73 A 18,18 0 1,1 12.73,-12.73 Z"
          fill="url(#t3Chrome)" stroke="#1A1F26" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 19.09,-19.09 A 27,27 0 1,0 19.09,19.09" fill="none" stroke="url(#t3Energy)" stroke-width="6"/>
    <path d="M 22,-30 A 33,33 0 0,0 -22,-30" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.85"/>
  </g>

  <!-- Front half of halo ring -->
  <g transform="translate(120,90) rotate(-12)">
    <path d="M -90,0 A 90,22 0 0,1 90,0" fill="none" stroke="#1A1F26" stroke-width="6.5"/>
    <path d="M -88,0 A 88,20 0 0,1 88,0" fill="none" stroke="url(#t3RingChrome)" stroke-width="2.5"/>
  </g>
</svg>
