<!doctype html>
<html lang="en" data-theme="starcommand">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&family=Jura:wght@500;700&family=Orbitron:wght@500..900&family=Oswald:wght@500;700&family=Rajdhani:wght@400;600&display=swap"
			rel="stylesheet"
		/>
		<script>
			(function () {
				try {
					var saved = localStorage.getItem('mode');
					var isDark = saved
						? saved === 'dark'
						: window.matchMedia('(prefers-color-scheme: dark)').matches;
					if (isDark) document.documentElement.classList.add('dark');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<!--data-sveltekit-preload-data="false" data-sveltekit-reload-->
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
